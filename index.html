<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#58172d">

  <title>Track Your Order | Nakshatra Publishers</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4f1;
      color: #29252a;
      min-height: 100vh;
    }

    header {
      background: #58172d;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 23px;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 7px;
      color: #f0dce3;
      font-size: 13px;
    }

    main {
      max-width: 650px;
      margin: 45px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.05);
    }

    h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .description {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ded9dc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #8c3655;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #58172d;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>NAKSHATRA PUBLISHERS</h1>
    <p>Official Order Tracking Portal</p>
  </header>

  <main>
    <section class="card">
      <h2>Track Your Order</h2>

      <p class="description">
        Enter your Order ID to check the latest status
        and follow your order journey.
      </p>

      <form id="trackingForm">
        <label for="orderId">ORDER ID</label>

        <input
          type="text"
          id="orderId"
          placeholder="e.g. NKORD20260001"
          autocomplete="off"
          required
        >

        <button type="submit" id="trackButton">
          TRACK ORDER →
        </button>
      </form>
    </section>
  </main>

  <footer>
    © Nakshatra Publishers. All rights reserved.
  </footer>

  <script>
    const params = new URLSearchParams(
      window.location.search
    );

    const orderId = params.get('order_id');

    if (orderId) {
      document.getElementById('orderId').value =
        orderId;
    }

    document.getElementById('trackingForm')
      .addEventListener('submit', function(event) {
        event.preventDefault();

        const id = document.getElementById('orderId')
          .value.trim();

        if (!id) return;

        alert('Tracking API will be connected in the next development step.');
      });
  </script>

</body>
</html>
